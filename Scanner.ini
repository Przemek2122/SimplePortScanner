# SimplePortScanner Configuration File
# Comments start with '#'

# Target IPv4 address to scan
targetIp = 192.168.1.200

# Port range to scan
startPort = 0
endPort = 65536

# Connection timeouts in milliseconds
# Local -> 200 ms
# Global -> 1000 ms
tcpTimeoutMs = 200
# Local -> 1500 ms
# Global -> 2000 ms
udpTimeoutMs = 1500

# Number of retry attempts for UDP probes (UDP packets can get lost)
udpRetries = 2

# Maximum concurrent in-flight probes per worker thread
# Higher = faster scan but more system resources
maxInFlight = 1024

# Protocols to scan (true / false)
scanTcp = true
scanUdp = true

# Progress reporting
# Show periodic progress output (e.g. [Progress] 2000/65000)
showProgress = true
# Print progress every N completed probes
progressInterval = 2000
