# SimplePortScanner Custom Probes Configuration

[TCP]
# Custom TCP Payloads to send after a port is identified as open
# Format: TCP_<port> = "<payload>"
# Use \r, \n, and \x hex sequences for special characters

# FTP - Login attempt
TCP_21 = "USER anonymous\r\nPASS anonymous@example.com\r\n"

# SSH - Protocol identification string
TCP_22 = "SSH-2.0-SimplePortScanner\r\n"

# Telnet - IAC DO TERMINAL TYPE
TCP_23 = "\xff\xfd\x18\xff\xfd\x20\xff\xfd\x23\xff\xfd\x27"

# SMTP - Extended HELO
TCP_25 = "EHLO scanner.local\r\n"

# DNS over TCP (version.bind TXT CHAOS) - frame length (2 bytes) + query
TCP_53 = "\x00\x1d\x00\x01\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x07version\x04bind\x00\x00\x10\x00\x03"

